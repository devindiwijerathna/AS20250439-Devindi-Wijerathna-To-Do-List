<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager To-Do List</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">My To-Do List</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0 p-3">
                    <div class="card-body">
                       
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Task Manager</h2>
                            <p class="text-muted small">Organize your tasks and stay productive.</p>
                        </div>

                        
                        <div class="input-group mb-3">
                            <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                            <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
                        </div>
                        <div id="errorMsg" class="text-danger small mb-3" style="display: none;">Task cannot be empty or spaces only!</div>

                        
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted small">Your tasks</span>
                            <span class="badge bg-primary" id="taskCounter">0 remaining</span>
                        </div>

                        
                        <div class="btn-group mb-4 w-100" role="group">
                            <button type="button" class="btn btn-outline-primary filter-btn active" data-filter="all">All</button>
                            <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                            <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
                        </div>

                       
                        <ul id="taskList" class="list-group mb-4">
                            
                        </ul>

                        
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
